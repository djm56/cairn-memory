# systemd drop-in for setup (b) of docs/DEPLOY.md only: cairn serve stays on loopback, and a
# reverse proxy in front terminates TLS. Install it as
# /etc/systemd/system/cairn.service.d/cairn-behind-proxy.conf, then run
# systemctl daemon-reload and systemctl restart cairn.
#
# Do not use it for any other setup. --behind-proxy makes the session cookie Secure and the
# expected origin https, which breaks a plain-HTTP setup such as the SSH tunnel in DEPLOY.md.
# docs/deploy/cairn.service is left as it is, without the flag, for that reason.
[Service]
ExecStart=
ExecStart=/usr/local/bin/cairn serve --db /var/lib/cairn/cairn.db --addr 127.0.0.1:8788 --behind-proxy
