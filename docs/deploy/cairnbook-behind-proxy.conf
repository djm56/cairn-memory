# systemd drop-in for setup (b) of docs/DEPLOY.md only: cairnbook serve stays on loopback, and a
# reverse proxy in front terminates TLS. Install it as
# /etc/systemd/system/cairnbook.service.d/cairnbook-behind-proxy.conf, then run
# systemctl daemon-reload and systemctl restart cairnbook.
#
# Do not use it for any other setup. --behind-proxy makes the session cookie Secure and the
# expected origin https, which breaks a plain-HTTP setup such as the SSH tunnel in DEPLOY.md.
# docs/deploy/cairnbook.service is left as it is, without the flag, for that reason.
[Service]
ExecStart=
ExecStart=/usr/local/bin/cairnbook serve --db /var/lib/cairnbook/cairnbook.db --addr 127.0.0.1:8788 --behind-proxy
