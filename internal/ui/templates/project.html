{{define "body"}}{{with .Page}}<h1>{{.Name}}</h1>
{{with .DisplayName}}<p>{{.}}</p>{{end}}
<p class="muted">{{with .LearningsHref}}<a href="{{.}}">Learnings</a>{{end}}</p>

<h2>Settings</h2>
<dl class="facts">
<dt>Parallel tasks</dt><dd>{{.Parallel}}</dd>
</dl>

<h2>Close policy</h2>
<table>
<tbody>{{range .Switches}}<tr><th>{{.Label}}</th><td>{{.State}}</td></tr>
{{end}}</tbody>
</table>
<p class="muted">Created {{.CreatedAt}}. Last seen {{.LastSeenAt}}.</p>
{{end}}{{end}}
