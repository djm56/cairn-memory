name: CI

# The local verification gate (CONTRIBUTING.md) on Linux, and the check of the
# Claude Code plugin with the pinned Claude Code. No secrets and no publishing;
# release builds arrive with Later in docs/PLAN.md §3.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: build, vet, fmt, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags, so git describe in make build matches a
          # local build.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Pinned to the version go.mod declares.
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build && bin/cairnbook version

      - name: go vet
        run: make vet

      - name: gofmt
        run: make fmt-check

      - name: go test -race
        run: make test

      - name: Cross-compile and vet for Windows, macOS, FreeBSD and OpenBSD
        # A compile check only, so a platform break is caught on the pull request. None of these
        # is run here, and Windows is not a supported target. The targets are in the Makefile
        # (cross), where go vet compiles the _test.go files as well.
        run: make cross

      - name: Invisible and bidirectional characters
        # Refuses a tracked file that holds one, including a byte-order mark (Makefile, scan-invisible).
        run: make scan-invisible

      - name: Local paths
        # Refuses a tracked file that names a local user or machine layout, such as a home or
        # volume path, other than the placeholder user "you" (Makefile, scan-local-paths).
        run: make scan-local-paths

  plugin:
    name: claude plugin validate
    runs-on: ubuntu-latest
    env:
      # The Claude Code version the plugin is validated with, pinned exactly so a new release cannot change the result.
      # Bump it here, in the pull request that checks the new version.
      CLAUDE_CODE_VERSION: "2.1.326"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        # Claude Code 2.1.326 needs Node 22 or later.
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code at the pinned version
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          test "$(claude --version | awk '{print $1}')" = "${CLAUDE_CODE_VERSION}"

      - name: Validate the plugin and the marketplace
        # Validation reads the files only. It needs no API key and no login, which was checked on the pinned version
        # with no key set and an empty home directory.
        run: |
          claude plugin validate ./plugins/claude-code --strict
          claude plugin validate .
