name: Decision
description: A design question for the operator. The decisions in docs/PLAN.md §8 are adopted.
title: "[decision] "
labels: ["type:decision", "needs-operator"]
body:
  - type: markdown
    attributes:
      value: |
        The decisions in docs/PLAN.md §8 were adopted by the operator, each with its date.
        Some are superseded and kept as the record. The list in §8 is the one to read; this
        form does not repeat it, so it cannot fall behind. Reopening a decision needs the
        operator, so say which one and why in the question below.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: The decision to make, in one or two sentences.
    validations:
      required: true
  - type: dropdown
    id: touches
    attributes:
      label: Which PLAN §8 decision does this touch? Name its number in the question.
      options:
        - "None: a new decision"
        - "An adopted decision in docs/PLAN.md §8"
        - "A superseded decision in docs/PLAN.md §8, reopened"
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: The choices on the table, each with its cost.
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
      description: The option you would pick, and the reason.
    validations:
      required: true
