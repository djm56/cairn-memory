name: Bug
description: Something Cairnbook does wrong.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. cairnbook init
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cairnbook version
      description: The output of `cairnbook version`.
      placeholder: "v0.x.y-dirty"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      description: How the call reached Cairnbook.
      options:
        - Claude Code
        - OpenCode
        - pi
        - Other or CLI only
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, and whether you use a server (cairnbook serve).
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Relevant output. Remove anything private; Cairnbook databases stay out of issues.
      render: text
